<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Harmonie Électricité</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Accueil de l'app Harmonie : design system de l'app (noir, or seul accent, Jost).
   Mise en page : une colonne centrée, en-tête collant, vues qui se remplacent (accueil, liste, client, fiche, création). */
:root {
  color-scheme: dark;
  --noir: #0A0A0A; --or: #C9A86A; --or-clair: #DFC28C; --or-fonce: #A8843F; --blanc: #F4F1EA;
  --encre-800: #111111; --encre-700: #181818; --encre-600: #222222; --encre-500: #2C2C2C;
  --gris-300: #A8A49A; --gris-400: #857F74; --gris-500: #635D52;
  --texte: #C8C4BA;
  --trait: rgba(201,168,106,0.12); --trait-moyen: rgba(201,168,106,0.22); --trait-fort: rgba(201,168,106,0.42);
  --degrade-or: linear-gradient(135deg, #C9A86A 0%, #DFC28C 50%, #C9A86A 100%);
  --lueur: 0 0 12px rgba(201,168,106,0.25), 0 0 4px rgba(201,168,106,0.15);
  --ok: #9DB07F; --attention: #D9A35B; --erreur: #C8705F;
  --police: 'Jost', system-ui, 'Segoe UI', sans-serif;
  --fs-xs: 11px; --fs-sm: 12.5px; --fs-base: 14.5px; --fs-lg: 17px; --fs-xl: 21px; --fs-2xl: 28px;
  --esp-large: 0.12em; --esp-tres-large: 0.22em;
  --r-sm: 4px; --r-md: 10px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; font-family: var(--police); font-size: var(--fs-base); color: var(--texte); background: var(--noir);
  background-image: linear-gradient(160deg, #111111 0%, #0A0A0A 60%, #0d0c09 100%); background-attachment: fixed; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--noir); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--or); outline-offset: 2px; }
svg.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.bandeau-maquette { background: rgba(217,163,91,0.12); border-bottom: 1px solid rgba(217,163,91,0.35); color: var(--attention);
  font-size: var(--fs-sm); text-align: center; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(10,10,10,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--trait); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.entete-int { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.monogramme { width: 34px; height: 34px; flex: none; }
.entete-titre { flex: 1; min-width: 0; }
.sourcil { font-size: var(--fs-xs); letter-spacing: var(--esp-tres-large); text-transform: uppercase; color: var(--or); font-weight: 500; }
.entete h1 { margin: 2px 0 0; font-weight: 300; font-size: var(--fs-xl); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--blanc);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main { max-width: 860px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vue { animation: entree 260ms var(--ease); }
@keyframes entree { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm);
  border: 1px solid var(--trait-fort); background: transparent; color: var(--blanc); font-size: var(--fs-sm); font-weight: 500;
  letter-spacing: var(--esp-large); text-transform: uppercase; transition: 150ms var(--ease); white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--or); color: var(--or-clair); box-shadow: var(--lueur); }
.btn-or { background: var(--degrade-or); border-color: transparent; color: var(--noir); font-weight: 600; }
.btn-or:hover { color: var(--noir); filter: brightness(1.06); }
.btn-discret { border-color: transparent; color: var(--gris-300); }
.btn-carre { width: 44px; padding: 0; flex: none; }

/* Accueil : deux tuiles */
.salut { margin: 6px 0 18px; }
.salut h2 { margin: 4px 0 0; font-weight: 300; font-size: var(--fs-2xl); color: var(--blanc); letter-spacing: 0.02em; text-wrap: balance; }
.tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tuile { position: relative; text-align: left; border: 1px solid var(--trait-moyen); border-radius: var(--r-md); background: rgba(17,17,17,0.92);
  padding: 20px; min-height: 210px; display: flex; flex-direction: column; gap: 14px; transition: 200ms var(--ease); overflow: hidden; }
.tuile:hover { border-color: var(--or); box-shadow: var(--lueur); transform: translateY(-2px); }
.tuile .pictos { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--trait-fort); display: grid; place-items: center; color: var(--or); }
.tuile .pictos svg.ic { width: 24px; height: 24px; }
.tuile h3 { margin: 0; font-weight: 400; font-size: var(--fs-xl); color: var(--blanc); letter-spacing: var(--esp-large); text-transform: uppercase; line-height: 1.2; text-wrap: balance; }
.tuile p { margin: 0; color: var(--gris-300); line-height: 1.45; }
.tuile .chiffres { margin-top: auto; display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--gris-300); font-variant-numeric: tabular-nums; }
.tuile .chiffres b { color: var(--blanc); font-weight: 500; font-size: var(--fs-lg); margin-right: 4px; }
.tuile .chiffres .encours b { color: var(--attention); }
.tuile .trace { position: absolute; right: -30px; top: -30px; width: 150px; height: 150px; opacity: .18; pointer-events: none; }
.raccourcis { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; }
.recents { margin-top: 26px; }
.titre-section { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--trait); padding-bottom: 6px; margin-bottom: 10px; }
.titre-section h2 { margin: 0; font-weight: 300; font-size: var(--fs-lg); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--blanc); }
.titre-section span { font-size: var(--fs-sm); color: var(--gris-400); }

/* Liste d'un module */
.barre-outils { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.recherche { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; border: 1px solid var(--trait-moyen); background: var(--encre-700);
  border-radius: var(--r-sm); padding: 0 12px; min-height: 46px; color: var(--gris-400); }
.recherche:focus-within { border-color: var(--or); }
.recherche input { flex: 1; min-width: 0; border: 0; background: none; outline: none; min-height: 44px; color: var(--blanc); }
.filtres { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.puce { border: 1px solid var(--trait-moyen); background: none; border-radius: 999px; padding: 6px 14px; font-size: var(--fs-sm); color: var(--gris-300); min-height: 34px; }
.puce[aria-pressed="true"] { border-color: var(--or); color: var(--noir); background: var(--or); font-weight: 500; }
.puce .n { margin-left: 6px; opacity: .75; font-variant-numeric: tabular-nums; }
.groupe { margin-top: 20px; }
.groupe-tete { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-bottom: 1px solid var(--trait); padding: 6px 0; text-align: left; }
.lettre { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--encre-600); color: var(--or); font-size: var(--fs-sm); font-weight: 600; flex: none; }
.groupe-tete b { flex: 1; min-width: 0; font-weight: 500; color: var(--blanc); letter-spacing: 0.04em; text-transform: uppercase; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.groupe-tete span { font-size: var(--fs-xs); color: var(--gris-400); letter-spacing: var(--esp-large); text-transform: uppercase; }
.groupe-tete:hover b { color: var(--or-clair); }
.cartes { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.carte { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; text-align: left;
  border: 1px solid var(--trait-moyen); border-radius: var(--r-md); background: rgba(17,17,17,0.92); padding: 12px 14px; transition: 150ms var(--ease); }
.carte:hover { border-color: var(--or); box-shadow: var(--lueur); }
.carte.neuf { border-color: var(--or); box-shadow: var(--lueur); }
.carte .nom { color: var(--blanc); font-size: var(--fs-lg); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.carte .sous { grid-column: 1; font-size: var(--fs-sm); color: var(--gris-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.carte .droite { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.etat { font-size: var(--fs-xs); letter-spacing: var(--esp-large); text-transform: uppercase; border-radius: 999px; padding: 3px 9px; border: 1px solid; white-space: nowrap; }
.etat.encours { color: var(--attention); border-color: rgba(217,163,91,.45); }
.etat.termine { color: var(--ok); border-color: rgba(157,176,127,.45); }
.etat.prevu { color: var(--gris-300); border-color: var(--trait-fort); }
.mini-barre { width: 92px; height: 3px; background: var(--encre-500); border-radius: 2px; overflow: hidden; }
.mini-barre i { display: block; height: 100%; background: var(--or); }
.compte { font-size: var(--fs-xs); color: var(--gris-300); font-variant-numeric: tabular-nums; white-space: nowrap; }
.type { font-size: var(--fs-xs); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--or); }
.vide { text-align: center; padding: 34px 12px; color: var(--gris-400); border: 1px dashed var(--trait-moyen); border-radius: var(--r-md); margin-top: 18px; line-height: 1.5; }

/* Formulaires */
.panneau { border: 1px solid var(--trait-moyen); border-radius: var(--r-md); background: rgba(17,17,17,0.92); padding: 18px; }
.panneau + .panneau { margin-top: 14px; }
.panneau h3 { margin: 0 0 4px; font-weight: 300; font-size: var(--fs-lg); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--blanc); }
.champ { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; position: relative; min-width: 0; }
.champ > label, .etiq { font-size: var(--fs-xs); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--gris-300); }
.champ input, .champ textarea, .champ select { min-height: 44px; border: 1px solid var(--trait-moyen); background: var(--encre-700); border-radius: var(--r-sm); padding: 8px 12px; width: 100%; }
.champ input:focus, .champ textarea:focus, .champ select:focus { border-color: var(--or); outline: none; }
.champ.erreur input { border-color: var(--erreur); }
.champ input.prerempli { border-color: var(--or); box-shadow: var(--lueur); transition: 600ms var(--ease); }
.msg-erreur { color: var(--erreur); font-size: var(--fs-sm); }
.ligne { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.aide { font-size: var(--fs-sm); color: var(--gris-400); margin: 6px 0 0; line-height: 1.45; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 18px; }

/* Choix du client avec création */
.choix-client { position: relative; }
.propositions { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 15; background: var(--encre-700); border: 1px solid var(--trait-fort);
  border-radius: var(--r-sm); max-height: 280px; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.propositions button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--trait); padding: 11px 12px; display: flex; justify-content: space-between; gap: 10px; }
.propositions button:hover, .propositions button.actif { background: var(--encre-600); }
.propositions button span { color: var(--gris-400); font-size: var(--fs-sm); white-space: nowrap; }
.propositions .creer { color: var(--or-clair); font-weight: 500; }
.propositions .creer svg.ic { width: 16px; height: 16px; }
.client-choisi { display: flex; align-items: center; gap: 12px; border: 1px solid var(--or); border-radius: var(--r-sm); padding: 8px 8px 8px 12px; background: rgba(201,168,106,0.06); }
.client-choisi div { flex: 1; min-width: 0; }
.client-choisi b { display: block; color: var(--blanc); font-weight: 500; }
.client-choisi span { font-size: var(--fs-sm); color: var(--gris-400); }
.nouveau-client { margin-top: 12px; border: 1px solid var(--trait-fort); border-left: 2px solid var(--or); border-radius: var(--r-sm); padding: 4px 14px 14px; background: var(--encre-800); }

/* Niveaux et places */
.niveau-ligne { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto auto; gap: 8px; align-items: end; margin-top: 10px; }
.niveau-ligne .champ { margin-top: 0; }
.nb-places { min-height: 44px; display: grid; place-items: center; padding: 0 10px; font-size: var(--fs-sm); color: var(--or); font-variant-numeric: tabular-nums; white-space: nowrap; }
.choix-depart { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.option { text-align: left; border: 1px solid var(--trait-moyen); border-radius: var(--r-sm); background: var(--encre-700); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.option b { color: var(--blanc); font-weight: 500; }
.option span { font-size: var(--fs-sm); color: var(--gris-400); line-height: 1.4; }
.option[aria-pressed="true"] { border-color: var(--or); box-shadow: var(--lueur); }

/* Fiche */
.fiche-tete { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.fiche-tete > div { flex: 1; min-width: 0; }
.fiche-tete h2 { margin: 4px 0 2px; font-weight: 300; font-size: var(--fs-2xl); color: var(--blanc); letter-spacing: 0.02em; }
.lien-client { background: none; border: 0; padding: 0; color: var(--or-clair); text-decoration: underline; text-underline-offset: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.stat { border: 1px solid var(--trait); border-radius: var(--r-sm); padding: 12px; }
.stat b { display: block; font-size: var(--fs-xl); color: var(--blanc); font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--fs-xs); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--gris-400); }
.tableau-defile { overflow-x: auto; margin-top: 12px; border: 1px solid var(--trait); border-radius: var(--r-sm); }
table { border-collapse: collapse; width: 100%; min-width: 460px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--trait); }
th { font-size: var(--fs-xs); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--gris-300); font-weight: 500; background: var(--encre-700); }
tr.ecarte td { opacity: .4; }
.table-logements { min-width: 760px; }
.table-logements td { padding: 6px 6px; }
.table-logements td input, .table-logements td select { width: 100%; min-width: 0; min-height: 36px; border: 1px solid var(--trait-moyen); background: var(--encre-700); border-radius: var(--r-sm); padding: 4px 8px; color: var(--blanc); }
.table-logements td input.court { width: 58px; }
.table-logements td input[type=checkbox] { width: 18px; min-height: 18px; accent-color: var(--or); }
td input { width: 110px; min-height: 36px; border: 1px solid var(--trait-moyen); background: var(--encre-700); border-radius: var(--r-sm); padding: 4px 8px; color: var(--blanc); }
td input:focus { border-color: var(--or); outline: none; }
td.conso { color: var(--blanc); }
td.alerte { color: var(--erreur); }
tr.alerte td input { border-color: var(--erreur); }
.encart { margin-top: 12px; padding: 12px 14px; border-radius: var(--r-sm); background: rgba(201,168,106,0.07); border: 1px solid var(--trait-moyen); font-size: var(--fs-sm); line-height: 1.5; }
.coordonnees { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin-top: 12px; }
.coordonnees div { min-width: 0; overflow-wrap: anywhere; }
.coordonnees span { display: block; font-size: var(--fs-xs); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--gris-400); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--encre-600); border: 1px solid var(--trait-fort); color: var(--blanc); padding: 10px 16px; border-radius: var(--r-sm);
  transition: 250ms var(--ease); pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
.toast.vu { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .tuiles { grid-template-columns: 1fr; }
  .tuile { min-height: 0; }
  .ligne, .choix-depart, .coordonnees { grid-template-columns: 1fr; }
  .niveau-ligne { grid-template-columns: minmax(0, 1fr) auto auto; padding-bottom: 10px; border-bottom: 1px solid var(--trait); }
  .niveau-ligne .champ:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat b { font-size: var(--fs-lg); }
}

.sync { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); letter-spacing: var(--esp-large); text-transform: uppercase; color: var(--gris-300); white-space: nowrap; flex: none; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--gris-500); flex: none; }
.sync.ok i { background: var(--ok); } .sync.attente i { background: var(--attention); } .sync.erreur i { background: var(--erreur); }
@media (max-width: 420px) { .sync span { display: none; } }
a.btn { cursor: pointer; }
</style>
</head>

<header class="entete">
  <div class="entete-int">
    <button type="button" class="btn btn-carre btn-discret" id="retour" aria-label="Retour" hidden><svg class="ic"><use href="#i-back"/></svg></button>
    <img class="monogramme" id="monogramme" alt="Harmonie Électricité">
    <div class="entete-titre">
      <div class="sourcil" id="sourcil">Harmonie Électricité</div>
      <h1 id="titre">Accueil</h1>
    </div>
    <span class="sync" id="etatDonnees" title="État des données"><i></i><span>…</span></span>
  </div>
</header>
<main id="vue"></main>
<div class="toast" id="toast" role="status"></div>

<script src="logos.js"></script>
<script src="commun.js"></script>
<script>
'use strict';
/* ============================================================
   Accueil de l'app Harmonie : relevés de consommation et émargement interphonie.
   Chantiers rangés par client (A → Z), recherche, création avec les clients de l'app métier.
   Les pages de saisie restent releves.html (?c=RB_…) et emargement.html (?chantier=CH_…).
   ============================================================ */
const MODULES = {
  releve: { nom: 'Relevés de consommation', court: 'Relevés', icone: 'i-bolt', unite: 'relevés', nouveau: 'Nouveau relevé',
    texte: 'Index des compteurs des bornes de recharge, photo par place, consommation et montant pour le syndic.' },
  interphonie: { nom: 'Émargement interphonie', court: 'Interphonie', icone: 'i-interphone', unite: 'signés', nouveau: 'Nouveau chantier',
    texte: 'Pose des combinés et moniteurs, badges, signatures des occupants, bons d’intervention.' },
};
// Catalogue repris de l'émargement (emargement.html) : marques et modèles proposés à la création.
const CATALOGUE = {
  Golmar: ['Golmar GTART · Audio simple à combiné', 'Golmar GART1 · Audio mains libres', 'Golmar GART4H/XLITE · Moniteur vidéo ART4 mains libres, écran 4,3"',
    'Golmar GART4TH/LITE · Moniteur couleur mains libres et à combiné 4,3"', 'Golmar GART4WH · Moniteur vidéo ART4 mains libres 4,3", ABS blanc, WiFi',
    'Golmar GART7/LITE · Moniteur vidéo couleur ART7 mains libres 7", ABS blanc', 'Golmar GART7W · Moniteur vidéo couleur ART7 mains libres 7", ABS blanc, WiFi'],
  Fermax: ['Fermax – Loft Basic', 'Fermax – Loft Extra', 'Fermax – VEO 4,3"', 'Fermax – VEO-XS'],
  Intratone: ['Intratone – Combiné audio', 'Intratone – Moniteur vidéo 7"'],
  Bticino: ['Bticino – Classe 100 A16E', 'Bticino – Classe 100 V16E', 'Bticino – Classe 300 X13E'],
  Urmet: ['Urmet – Atlantico'],
};
const CENTRALES = ['Noralsy EasyConnect', 'Noralsy (autre centrale)', 'Intratone', 'Autre'];
const EXTRAS_LISTING = ['Stock syndic', 'Entreprise de nettoyage'];
const TECHNICIEN = 'LARUICCI Mathieu';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dateFr = iso => iso ? String(iso).slice(0, 10).split('-').reverse().join('/') : '';
const LIB_ETAT = { encours: 'En cours', termine: 'Terminé', prevu: 'Prévu' };
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('vu'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('vu'), 3200); }
function lirePlaces(txt) {
  const out = [];
  for (const m of String(txt).split(/[\s,;]+/).filter(Boolean)) {
    const r = m.match(/^(\d+)-(\d+)$/);
    if (r && +r[2] >= +r[1] && +r[2] - +r[1] < 300) for (let i = +r[1]; i <= +r[2]; i++) out.push(String(i)); else out.push(m);
  }
  return [...new Set(out)];
}
function etatDonnees(genre, texte, titre) { const e = $('etatDonnees'); e.className = 'sync ' + genre; e.querySelector('span').textContent = texte; e.title = titre || texte; }

// ---------- Données ----------
// clients : table « clients » de l'app métier ; chantiers : lignes CH_ (émargement) et RB_ (relevés) de la table emargements,
// plus ce qui est sur cet appareil et pas encore en ligne.
const etat = { clients: clientsEnCache().filter(c => (c.name || '').trim() && c.type !== 'PROSPECT'), chantiers: [], charge: false };
const client = id => etat.clients.find(c => c.id === id);
const CLE_CACHE = 'he.accueil.chantiers';

// Relevés gardés sur l'appareil (IndexedDB de releves.html)
function ouvrirIDB() {
  return new Promise(ok => { try { const r = indexedDB.open('releves-bornes', 1); r.onupgradeneeded = () => r.result.createObjectStore('donnees'); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); } catch { ok(null); } });
}
const idbLire = (db, k) => new Promise(ok => { if (!db) return ok(null); const r = db.transaction('donnees').objectStore('donnees').get(k); r.onsuccess = () => ok(r.result ?? null); r.onerror = () => ok(null); });
const idbEcrire = (db, k, v) => new Promise((ok, ko) => { const t = db.transaction('donnees', 'readwrite'); t.objectStore('donnees').put(v, k); t.oncomplete = ok; t.onerror = () => ko(t.error); });
const cleConfig = id => id === 'RB_LANDART' ? 'config' : 'config:' + id;
const cleReleves = id => id === 'RB_LANDART' ? 'releves' : 'releves:' + id;
function resumeReleves(config, releves) {
  let faits = 0, total = 0;
  for (const n of config.niveaux || []) for (const p of n.places || []) {
    total++; const r = releves?.[n.id + '-' + p];
    if (r && !r.supprime && r.index != null && (r.photo || r.photoUrl)) faits++;
  }
  return { faits, total };
}
function statutDe(c) {
  if (c.total > 0 && c.faits >= c.total) return 'termine';
  if (c.faits > 0) return 'encours';
  return c.date && c.date > aujourdhuiIso() ? 'prevu' : 'encours';
}

async function chargerChantiers() {
  const parId = new Map();
  // 1. Sur cet appareil
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i); if (!k || !k.startsWith('he.emargement.ch.')) continue;
    try {
      const c = JSON.parse(localStorage.getItem(k)); if (!c?.id || c.exemple) continue;
      const reels = (c.logements || []).filter(l => !l.horsLogement);
      parId.set(c.id, { id: c.id, type: 'interphonie', residence: c.residence, adresse: c.adresse, date: c.date, clientId: c.clientId, syndic: c.donneur,
        faits: reels.filter(l => l.statut === 'signe' || l.statut === 'absent').length, total: reels.length, modifieLe: c.modifieLe || 0, local: true, aEnvoyer: !!c.aEnvoyer });
    } catch {}
  }
  const db = await ouvrirIDB();
  const campagnes = (await idbLire(db, 'campagnes')) || [];
  // Land’Art saisi avec l'ancienne version : ses relevés sont sous « config » / « releves », sans liste « campagnes ».
  if (!campagnes.includes('RB_LANDART') && await idbLire(db, 'config')) campagnes.push('RB_LANDART');
  for (const id of campagnes) {
    const config = await idbLire(db, cleConfig(id)); if (!config) continue;
    const { faits, total } = resumeReleves(config, await idbLire(db, cleReleves(id)));
    parId.set(id, versReleve(id, config, faits, total, true));
  }
  // 2. En ligne
  let enLigne = false;
  try {
    const sel = 'id,residence:payload->>residence,adresse:payload->>adresse,date:payload->>date,clientId:payload->>clientId,donneur:payload->>donneur,resume:payload->resume,modifieLe:payload->>modifieLe';
    const [rc, rr] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=${sel}&id=like.CH_*&order=id.desc&limit=2000`, { headers: SB }),
      fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=id,config:payload->config,resume:payload->resume&id=like.RB_*&limit=2000`, { headers: SB }),
    ]);
    if (!rc.ok || !rr.ok) throw new Error();
    const ch = await rc.json(), rb = await rr.json(), idsEnLigne = new Set([...ch, ...rb].map(x => x.id));
    for (const x of ch) {
      const loc = parId.get(x.id), res = x.resume || {};
      if (loc && loc.modifieLe > (+x.modifieLe || 0)) continue; // version de l'appareil plus récente
      // Avant le statut automatique, « fait » = signés + absents ; le résumé en ligne a ces deux nombres.
      parId.set(x.id, { id: x.id, type: 'interphonie', residence: x.residence, adresse: x.adresse, date: x.date, clientId: x.clientId, syndic: x.donneur,
        faits: (res.signes || 0) + (res.absents || 0), total: res.total || 0, modifieLe: +x.modifieLe || 0 });
    }
    for (const x of rb) {
      const loc = parId.get(x.id);
      if (!x.config || (loc && (loc.config?.modifieLe || 0) > (x.config.modifieLe || 0) && loc.local)) {
        if (loc) loc.faits = Math.max(loc.faits, x.resume?.faits || 0); // relevés faits sur un autre appareil
        continue;
      }
      parId.set(x.id, versReleve(x.id, x.config, Math.max(x.resume?.faits || 0, loc?.faits || 0), x.resume?.total ?? resumeReleves(x.config, {}).total, false));
    }
    // Copie locale d'un chantier supprimé en ligne, sans rien à envoyer : on ne l'affiche plus.
    for (const [id, c] of parId) if (c.local && !idsEnLigne.has(id) && !c.aEnvoyer && c.type === 'interphonie') parId.delete(id);
    enLigne = true;
  } catch {}
  // Une relève suivie d'une nouvelle relève est close, même si des places n'ont pas été relevées.
  const remplacees = new Set([...parId.values()].map(c => c.precedente).filter(Boolean));
  etat.chantiers = [...parId.values()].map(c => ({ ...c, statut: remplacees.has(c.id) ? 'termine' : statutDe(c) }));
  etat.charge = true;
  try { localStorage.setItem(CLE_CACHE, JSON.stringify(etat.chantiers)); } catch {}
  return enLigne;
}
function versReleve(id, config, faits, total, local) {
  return { id, type: 'releve', residence: config.residence, adresse: config.adresse, date: config.date || config.precedente?.date || '', clientId: config.clientId,
    syndic: config.syndic, faits, total, prochaine: config.prochaine || '', precedente: config.precedente?.id || null, config, local };
}

// Groupe d'un chantier : le client de l'app métier, sinon le syndic, sinon la résidence.
function groupeDe(c) {
  const cl = c.clientId && client(c.clientId);
  if (cl) return { cle: 'c:' + cl.id, nom: cl.name, clientId: cl.id };
  const nom = (c.syndic || c.residence || 'Sans client').trim();
  return { cle: 'n:' + sansAccent(nom), nom, clientId: null };
}

// ---------- Navigation ----------
let pile = [], vue = { nom: 'accueil' }, dernierCree = null;
function aller(v, empiler = true) { if (empiler) pile.push(vue); vue = v; rendre(); window.scrollTo({ top: 0 }); memoriser(); }
$('retour').onclick = () => { vue = pile.pop() || { nom: 'accueil' }; rendre(); memoriser(); };
function memoriser() { try { sessionStorage.setItem('he.accueil.vue', JSON.stringify({ vue: { ...vue, form: undefined }, pile: pile.map(p => ({ ...p, form: undefined })) })); } catch {} }
function entete(sourcil, titre) { $('sourcil').textContent = sourcil; $('titre').textContent = titre; $('retour').hidden = vue.nom === 'accueil'; }
function rendre() {
  const v = { accueil: vueAccueil, liste: vueListe, client: vueClient, fiche: vueFiche, nouveau: vueNouveau }[vue.nom] || vueAccueil;
  $('vue').innerHTML = ''; const div = document.createElement('div'); div.className = 'vue'; $('vue').appendChild(div); v(div);
}

// ---------- Accueil ----------
function vueAccueil(el) {
  entete('Harmonie Électricité', 'Accueil');
  const tuile = type => {
    const m = MODULES[type], l = etat.chantiers.filter(c => c.type === type);
    const aFinir = l.filter(c => c.statut !== 'termine').length;
    return `<button type="button" class="tuile" data-module="${type}">
      <svg class="trace" viewBox="0 0 100 100"><path d="M0 70 H40 L55 55 H100 M70 55 V0 M40 70 V100" stroke="#C9A86A" stroke-width="1" fill="none"/><circle cx="55" cy="55" r="3" fill="#C9A86A"/><circle cx="70" cy="55" r="3" fill="#C9A86A"/></svg>
      <span class="pictos"><svg class="ic"><use href="#${m.icone}"/></svg></span>
      <h3>${m.nom}</h3><p>${m.texte}</p>
      <span class="chiffres"><span><b>${l.length}</b>${type === 'releve' ? 'relevés' : 'chantiers'}</span><span class="encours"><b>${aFinir}</b>à terminer</span></span>
    </button>`;
  };
  // Cette semaine : chantiers prévus dans les 7 jours, relevés à faire, prochaines relèves programmées
  const auj = aujourdhuiIso(), dans7 = new Date(Date.now() + 7 * 864e5).toLocaleDateString('sv-SE');
  const semaine = [];
  for (const c of etat.chantiers) {
    if (c.statut !== 'termine' && c.date && c.date >= auj && c.date <= dans7) semaine.push({ c, date: c.date, quoi: c.type === 'releve' ? 'Relevé prévu' : 'Intervention' });
    if (c.prochaine && c.prochaine >= auj && c.prochaine <= dans7) semaine.push({ c, date: c.prochaine, quoi: 'Prochaine relève' });
  }
  semaine.sort((a, b) => a.date.localeCompare(b.date));
  const enRetard = etat.chantiers.filter(c => c.statut !== 'termine' && (!c.date || c.date < auj)).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 6);
  el.innerHTML = `<div class="salut"><div class="sourcil">${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div><h2>Que faisons-nous aujourd’hui&nbsp;?</h2></div>
    <div class="tuiles">${tuile('releve')}${tuile('interphonie')}</div>
    <section class="recents"><div class="titre-section"><h2>Cette semaine</h2><span>du ${dateFr(auj)} au ${dateFr(dans7)}</span></div>
      <div class="cartes">${semaine.length ? semaine.map(s => carte(s.c, true, `<span class="type">${s.quoi} · ${dateFr(s.date)}</span>`)).join('') : '<div class="vide" style="margin-top:0">Rien de prévu dans les 7 jours.</div>'}</div></section>
    ${enRetard.length ? `<section class="recents"><div class="titre-section"><h2>À reprendre</h2><span>en cours, sans date à venir</span></div>
      <div class="cartes">${enRetard.map(c => carte(c)).join('')}</div></section>` : ''}
    ${!etat.charge ? '<p class="aide">Chargement des chantiers…</p>' : ''}`;
  el.querySelectorAll('.tuile').forEach(b => b.onclick = () => aller({ nom: 'liste', type: b.dataset.module }));
  brancherCartes(el);
}

// ---------- Carte d'un chantier ----------
function carte(c, avecType = true, entree = '') {
  const g = groupeDe(c), pct = c.total ? Math.round(100 * c.faits / c.total) : 0;
  const sous = [avecType ? `<span class="type">${MODULES[c.type].court}</span>` : '', esc(g.nom !== c.residence ? g.nom : ''), esc(villeDe(c.adresse)), c.date ? dateFr(c.date) : ''].filter(Boolean).join(' · ');
  return `<button type="button" class="carte${c.id === dernierCree ? ' neuf' : ''}" data-chantier="${esc(c.id)}">
    <span class="nom">${esc(c.residence || 'Sans nom')}</span>
    <span class="droite"><span class="etat ${c.statut}">${LIB_ETAT[c.statut]}</span>
      <span class="compte">${c.faits} / ${c.total} ${MODULES[c.type].unite}</span><span class="mini-barre"><i style="width:${pct}%"></i></span></span>
    <span class="sous">${entree ? entree + ' · ' : ''}${sous}</span>
  </button>`;
}
function brancherCartes(el) { el.querySelectorAll('[data-chantier]').forEach(b => b.onclick = () => aller({ nom: 'fiche', id: b.dataset.chantier })); }

// ---------- Liste d'un module : recherche, filtres, regroupement par client A → Z ----------
function vueListe(el) {
  const m = MODULES[vue.type]; entete(m.nom, m.court);
  vue.filtre ??= 'tous'; vue.q ??= '';
  el.innerHTML = `<div class="barre-outils">
      <label class="recherche"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Client, résidence ou ville…" autocomplete="off" value="${esc(vue.q)}"></label>
      <button type="button" class="btn btn-or" id="nouveau"><svg class="ic"><use href="#i-plus"/></svg>${m.nouveau}</button>
    </div>
    <div class="filtres" role="group" aria-label="Filtrer">
      ${[['tous', 'Tous'], ['encours', 'En cours'], ['termine', 'Terminés']].map(([k, t]) => `<button type="button" class="puce" data-f="${k}" aria-pressed="${vue.filtre === k}">${t}<span class="n"></span></button>`).join('')}
    </div>
    <div id="resultats"></div>`;
  const maj = () => {
    const q = sansAccent(vue.q).trim();
    const duModule = etat.chantiers.filter(c => c.type === vue.type);
    const correspond = c => !q || [groupeDe(c).nom, c.residence, c.adresse, c.syndic].some(t => sansAccent(t).includes(q));
    const filtre = { tous: () => true, encours: c => c.statut !== 'termine', termine: c => c.statut === 'termine' };
    el.querySelectorAll('.puce').forEach(p => { p.querySelector('.n').textContent = duModule.filter(c => correspond(c) && filtre[p.dataset.f](c)).length; });
    const groupes = new Map();
    for (const c of duModule.filter(c => correspond(c) && filtre[vue.filtre](c))) {
      const g = groupeDe(c); if (!groupes.has(g.cle)) groupes.set(g.cle, { ...g, liste: [] }); groupes.get(g.cle).liste.push(c);
    }
    const ordre = [...groupes.values()].sort((a, b) => triFr(a.nom, b.nom));
    $('resultats').innerHTML = ordre.length ? ordre.map(g => `<section class="groupe">
        <button type="button" class="groupe-tete" data-groupe="${esc(g.cle)}"><span class="lettre">${esc((sansAccent(g.nom).match(/[a-z0-9]/) || ['#'])[0].toUpperCase())}</span><b>${esc(g.nom)}</b><span>${g.clientId ? 'Fiche client ›' : ''}</span></button>
        <div class="cartes">${g.liste.sort((a, b) => triFr(a.residence, b.residence) || (b.date || '').localeCompare(a.date || '')).map(c => carte(c, false)).join('')}</div></section>`).join('')
      : `<div class="vide">${duModule.length ? `Aucun résultat pour « ${esc(vue.q)} ».` : `Aucun ${vue.type === 'releve' ? 'relevé' : 'chantier'} pour l’instant.`}<br><button type="button" class="btn" id="creerDepuisVide" style="margin-top:12px"><svg class="ic"><use href="#i-plus"/></svg>${m.nouveau}</button></div>`;
    brancherCartes($('resultats'));
    $('resultats').querySelectorAll('[data-groupe]').forEach(b => b.onclick = () => { const g = groupes.get(b.dataset.groupe); if (g?.clientId) aller({ nom: 'client', id: g.clientId }); });
    $('creerDepuisVide')?.addEventListener('click', () => aller({ nom: 'nouveau', type: vue.type }));
  };
  $('q').addEventListener('input', e => { vue.q = e.target.value; maj(); memoriser(); });
  el.querySelectorAll('.puce').forEach(p => p.onclick = () => { vue.filtre = p.dataset.f; el.querySelectorAll('.puce').forEach(x => x.setAttribute('aria-pressed', x === p)); maj(); memoriser(); });
  $('nouveau').onclick = () => aller({ nom: 'nouveau', type: vue.type });
  maj();
}

// ---------- Fiche client ----------
function vueClient(el) {
  const cl = client(vue.id);
  if (!cl) { entete('Fiche client', 'Client'); el.innerHTML = '<div class="vide">Client introuvable.</div>'; return; }
  entete('Fiche client', cl.name);
  const cs = etat.chantiers.filter(c => c.clientId === cl.id).sort((a, b) => triFr(a.residence, b.residence) || (b.date || '').localeCompare(a.date || ''));
  el.innerHTML = `<div class="panneau"><div class="sourcil">Client</div><h3>${esc(cl.name)}</h3>
      <div class="coordonnees"><div><span>Code client</span>${esc(cl.id)}</div><div><span>Téléphone</span>${esc(cl.phone || '—')}</div>
        <div><span>E-mail</span>${esc(cl.email || '—')}</div><div><span>Adresse du chantier</span>${esc((cl.addressChantier || '').trim() || (cl.address || '').trim() || '—')}</div></div>
      ${cl.residences?.length ? `<p class="aide">Résidences : ${cl.residences.map(r => esc(r.nom)).join(', ')}</p>` : ''}</div>
    <section class="recents"><div class="titre-section"><h2>Chantiers et relevés</h2><span>${cs.length} au total</span></div>
      <div class="cartes">${cs.map(c => carte(c)).join('') || '<div class="vide" style="margin-top:0">Aucun chantier pour ce client.</div>'}</div>
      <div class="raccourcis"><button type="button" class="btn" data-n="releve"><svg class="ic"><use href="#i-bolt"/></svg>Nouveau relevé</button>
        <button type="button" class="btn" data-n="interphonie"><svg class="ic"><use href="#i-interphone"/></svg>Nouveau chantier interphonie</button></div></section>`;
  brancherCartes(el);
  el.querySelectorAll('[data-n]').forEach(b => b.onclick = () => aller({ nom: 'nouveau', type: b.dataset.n, client: cl.id }));
}

// ---------- Fiche d'un chantier ----------
function vueFiche(el) {
  const c = etat.chantiers.find(x => x.id === vue.id);
  if (!c) { entete('Chantier', ''); el.innerHTML = '<div class="vide">Chantier introuvable.</div>'; return; }
  const m = MODULES[c.type], releve = c.type === 'releve', g = groupeDe(c);
  entete(m.nom, c.residence);
  const historique = releve ? etat.chantiers.filter(x => x.type === 'releve' && x.id !== c.id && sansAccent(x.residence) === sansAccent(c.residence)).sort((a, b) => (b.date || '').localeCompare(a.date || '')) : [];
  el.innerHTML = `<div class="panneau"><div class="fiche-tete"><div>
        <div class="sourcil">${m.court}${c.date ? ' · ' + dateFr(c.date) : ''}</div><h2>${esc(c.residence)}</h2>
        ${g.clientId ? `<button type="button" class="lien-client" id="versClient">${esc(g.nom)}</button>` : esc(g.nom !== c.residence ? g.nom : '')}${c.adresse ? ' · ' + esc(c.adresse) : ''}</div>
        <span class="etat ${c.statut}">${LIB_ETAT[c.statut]}</span></div>
      <div class="stats"><div class="stat"><b>${c.faits}</b><span>${releve ? 'Relevées' : 'Signés ou absents'}</span></div>
        <div class="stat"><b>${Math.max(0, c.total - c.faits)}</b><span>À faire</span></div>
        <div class="stat"><b>${c.total}</b><span>${releve ? 'Places' : 'Logements'}</span></div></div>
      ${releve && c.config?.niveaux?.length ? `<p class="aide">${c.config.niveaux.map(n => `${esc(n.nom)} : ${n.places.length} places`).join(' · ')}${c.config.prixKwh != null ? ` · ${String(c.config.prixKwh).replace('.', ',')} € le kWh` : ''}</p>` : ''}
      ${releve && c.prochaine ? `<p class="aide">Prochaine relève : ${dateFr(c.prochaine)}</p>` : ''}
      <div class="actions" style="justify-content:flex-start">

// Dupliquer un chantier d'interphonie : mêmes logements (bâtiment, porte, occupant, modèle, badges prévus), sans ce qui a été fait.
async function dupliquerChantier(id) {
  let source = null;
  try { source = JSON.parse(localStorage.getItem('he.emargement.ch.' + id)); } catch {}
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${TABLE}?select=payload&id=eq.${encodeURIComponent(id)}`, { headers: SB });
    const d = r.ok && (await r.json())[0]?.payload;
    if (d && (!source || (d.modifieLe || 0) > (source.modifieLe || 0))) source = d;
  } catch {}
  if (!source) return toast('Chantier introuvable : vérifiez le réseau.');
  const garder = ['batiment', 'etage', 'porte', 'nomAffiche', 'occupant', 'tel', 'email', 'modele', 'plaque', 'badgesPrevu', 'nomListing', 'horsLogement', 'proprietaire'];
  const copie = {
    ...nouveauChantier({ residence: source.residence + ' (copie)', adresse: source.adresse, reference: '', donneur: source.donneur, donneurEmail: source.donneurEmail,
      clientId: source.clientId, residenceId: source.residenceId, marque: source.marque, centrale: source.centrale, copropriete: source.copropriete, technicien: source.technicien }),
  };
  copie.logements = (source.logements || []).map(l => {
    const n = nouveauLogement(Object.fromEntries(garder.filter(k => l[k] !== undefined).map(k => [k, l[k]])));
    if (n.badgesPrevu) n.badges = Array(n.badgesPrevu).fill('');
    if (l.horsLogement) n.rdvDate = '';
    return n;
  });
  ouvrirNouveauChantier(copie, 'Chantier dupliqué : renommez-le dans la fenêtre Chantier.');
}

function ouvrirNouveauChantier(c, message) {

// Saisie manuelle des logements (sans listing du syndic) : même résultat que l'import, un tableau à vérifier.
let logements = [];
function modelesDe(marque) { return marque && CATALOGUE[marque] ? CATALOGUE[marque] : Object.values(CATALOGUE).flat(); }
function genererLogements(g) {
  const bats = g.batiments.split(/[\s,;]+/).filter(Boolean); if (!bats.length) bats.push('');
  const out = []; let suite = 1;
  for (const b of bats) {
    if (g.numero !== 'suite') suite = 1;
    for (let e = g.de; e <= g.a; e++) for (let n = 1; n <= g.parEtage; n++) {
      const porte = g.numero === 'etage' ? String(e * 10 + n).padStart(2, '0') : g.numero === 'lettre' ? (b || '') + suite : String(suite);
      out.push({ garder: true, batiment: b, porte, etage: e === 0 ? 'RDC' : String(e), nom: '', tel: '', modele: g.modele, badges: g.badges });
      suite++;
    }
  }
  return out;
}

function brancherManuel() {
  const lire = () => ({ batiments: $('gBat').value, parEtage: Math.max(1, +$('gParEtage').value || 1), de: +$('gDe').value, a: Math.max(+$('gDe').value, +$('gA').value),

        $('nb' + inp.dataset.i).textContent = lirePlaces(f.niveaux[inp.dataset.i].places).length + ' places';
      });
      $('niveaux').querySelectorAll('[data-suppr]').forEach(b => b.onclick = () => { f.niveaux.splice(+b.dataset.suppr, 1); rendreNiveaux(); });
    };
    rendreNiveaux();
    $('ajoutNiveau').onclick = () => { f.niveaux.push({ nom: f.niveaux.length === 1 ? 'R+1' : 'Niveau ' + (f.niveaux.length + 1), places: '' }); rendreNiveaux(); };
  } else {
    const rendreDepart = () => {
      el.querySelectorAll('[data-depart]').forEach(b => b.setAttribute('aria-pressed', b.dataset.depart === f.depart));
      $('zoneDepart').innerHTML = f.depart === 'listing'
        ? '<p class="aide">« Créer le chantier » ouvre l’émargement sur le dépôt du listing, avec le client déjà choisi : déposez le fichier, vérifiez les logements, puis créez.</p>'
        : zoneManuelle($('marque').value);
      if (f.depart === 'manuel') brancherManuel();
      $('creer').textContent = f.depart === 'listing' ? 'Continuer avec le listing' : 'Créer le chantier';
    };
    el.querySelectorAll('[data-depart]').forEach(b => b.onclick = () => { f.depart = b.dataset.depart; rendreDepart(); });
    $('marque').addEventListener('change', () => { if (f.depart === 'manuel') { const g = $('gModele'); if (g) g.innerHTML = '<option value="">— À choisir —</option>' + modelesDe($('marque').value).map(x => `<option>${esc(x)}</option>`).join(''); rendreLogements(); } });
    rendreDepart();
  }

  $('annuler').onclick = () => $('retour').click();
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const cl = f.client && client(f.client);
    if (!cl) { const er = $('errClient'); if (er) er.hidden = false; toast('Choisissez le client ou créez-le.'); return; }
    const residence = $('residence').value.trim();
    $('chResidence').classList.toggle('erreur', !residence);
    if (!residence) { $('residence').focus(); return toast('Indiquez le nom de la résidence.'); }
    const res = f.residenceIndex !== undefined && f.residenceIndex !== '' ? cl.residences?.[f.residenceIndex] : null;
    const commun = { residence, adresse: $('adresse').value.trim(), date: $('date').value || aujourdhuiIso() };
    if (releve) {
      const niveaux = f.niveaux.map((n, i) => ({ nom: (n.nom || 'Niveau ' + (i + 1)).trim(), places: lirePlaces(n.places) })).filter(n => n.places.length);
      if (!niveaux.length) return toast('Ajoutez au moins une place.');
      const prix = $('prix').value.trim() ? Number($('prix').value.replace(/\s/g, '').replace(',', '.')) : null;
      if (prix != null && !isFinite(prix)) { $('prix').focus(); return toast('Prix du kWh invalide (ex. 0,2516).'); }
      const ids = new Set();
      const config = { id: 'RB_' + Date.now().toString(36).toUpperCase(), modifieLe: Date.now(), ...commun, syndic: $('syndic').value.trim(), syndicEmail: $('syndicEmail').value.trim(),
        clientId: cl.id, consignes: $('consignes').value.trim(), prixKwh: prix, proprietaires: {}, precedente: null, prochaine: '',
        niveaux: niveaux.map(n => { let id = sansAccent(n.nom).replace(/[^a-z0-9]+/g, '').toUpperCase().slice(0, 12) || 'N'; while (ids.has(id)) id += '1'; ids.add(id); return { id, ...n }; }) };
      const db = await ouvrirIDB();
      if (!db) return toast('Stockage de l’appareil indisponible : relevé non créé.');
      await idbEcrire(db, 'config:' + config.id, config); await idbEcrire(db, 'releves:' + config.id, {});
      const l = (await idbLire(db, 'campagnes')) || []; l.push(config.id); await idbEcrire(db, 'campagnes', l);
      location.href = 'releves.html?c=' + encodeURIComponent(config.id);
      return;
    }
    const base = { ...commun, donneur: $('syndic').value.trim() || cl.name, donneurEmail: $('syndicEmail').value.trim(), clientId: cl.id,
      residenceId: res?.id || null, technicien: $('technicien').value.trim() || TECHNICIEN, marque: $('marque').value, centrale: $('centrale').value };
    if (f.depart === 'listing') {
      // L'import du listing (lecture PDF, Word, Excel, photo) reste dans l'émargement.
      location.href = 'emargement.html?listing=1&client=' + encodeURIComponent(cl.name);
      return;
    }
    const gardes = logements.filter(l => l.garder);
    if (!gardes.length) return toast('Créez la liste des logements (bouton « Créer la liste des logements »).');
    const c = nouveauChantier({ ...base, copropriete: residence });
    c.logements = [
      ...gardes.map(l => { const nb = Math.max(0, parseInt(l.badges, 10) || 0); return nouveauLogement({ batiment: l.batiment.trim(), etage: String(l.etage).trim(), porte: String(l.porte).trim(),
        nomAffiche: l.nom.trim().toUpperCase(), occupant: l.nom.trim(), nomListing: l.nom.trim(), tel: l.tel.trim(), modele: l.modele, badgesPrevu: nb || null, badges: Array(nb).fill('') }, c.date); }),
      ...EXTRAS_LISTING.map(nom => nouveauLogement({ occupant: nom, nomListing: nom, horsLogement: true, rdvDate: '' })),
    ];
    ouvrirNouveauChantier(c, `Chantier créé : ${gardes.length} logements + Stock syndic + Entreprise de nettoyage.`);
  });
}

// ---------- Démarrage ----------
(async () => {
  try { $('monogramme').src = LOGO_MONOGRAMME; } catch {}
  try { etat.chantiers = JSON.parse(localStorage.getItem(CLE_CACHE)) || []; } catch {}
  try { const m = JSON.parse(sessionStorage.getItem('he.accueil.vue')); if (m?.vue) { vue = m.vue; pile = m.pile || []; } } catch {}
  rendre();
  etatDonnees('attente', 'Chargement…');
  const [enLigne] = await Promise.all([chargerChantiers(), chargerClients().then(c => { etat.clients = c; })]);
  if (!document.activeElement || !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) rendre();
  etatDonnees(enLigne ? 'ok' : '', enLigne ? 'À jour' : 'Hors ligne', enLigne ? 'Chantiers et clients à jour' : 'Hors ligne : chantiers et clients de cet appareil');
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
window.addEventListener('pageshow', e => { if (e.persisted) chargerChantiers().then(rendre); });
</script>
</body>
